version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cache-stampede-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=8080
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cache-net
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: cache-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cache-net
    restart: unless-stopped

networks:
  cache-net:
    driver: bridge
